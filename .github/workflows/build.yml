name: Build and Release Mod

on:
  push:
    branches: [ master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 25
      uses: actions/setup-java@v4
      with:
        java-version: '25'
        distribution: 'temurin'
        cache: 'gradle'

    - name: Make Gradle Wrapper Executable
      run: chmod +x gradlew

    - name: Build with Gradle
      run: |
        if [[ $GITHUB_REF == refs/tags/v* ]]; then
          VERSION=${GITHUB_REF_NAME#v}
          echo "Building tag version: $VERSION"
          ./gradlew build -PtargetMcVersion=26.1.2 -Pmod_version=$VERSION
          ./gradlew build -PtargetMcVersion=26.2 -Pmod_version=$VERSION
        else
          ./gradlew build -PtargetMcVersion=26.1.2
          ./gradlew build -PtargetMcVersion=26.2
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: qfov-builds
        path: build/libs/*.jar

    # Only run release when a tag starting with 'v' is pushed
    - name: Create GitHub Release
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        files: |
          build/libs/qfov-*.jar
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
